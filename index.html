
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopManager - Gestion Simplifiée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans', sans-serif;
            background-color: #f8f9fc;
            color: #0e121b;
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
        }
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
          from { opacity: 0; transform: scale(0.95); }
          to { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse-soft {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.5; transform: scale(1.1); }
        }
        .animate-pulse-soft {
          animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .animate-stagger-1 { animation: fadeIn 0.5s ease-out forwards; animation-delay: 0s; opacity: 0; }
        .animate-stagger-2 { animation: fadeIn 0.5s ease-out forwards; animation-delay: 0.1s; opacity: 0; }
        .animate-stagger-3 { animation: fadeIn 0.5s ease-out forwards; animation-delay: 0.2s; opacity: 0; }
        .animate-stagger-4 { animation: fadeIn 0.5s ease-out forwards; animation-delay: 0.3s; opacity: 0; }
        .animate-stagger-5 { animation: fadeIn 0.5s ease-out forwards; animation-delay: 0.4s; opacity: 0; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
